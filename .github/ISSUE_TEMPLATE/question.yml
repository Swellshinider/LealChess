name: Question
description: Ask for help using or contributing to LealChess.
title: ''
labels: [question]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Using LealChess
        - Local development
        - Contributing
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include enough context for someone else to understand the goal.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the documentation and existing issues.
          required: true
        - label: This question does not contain private or security-sensitive information.
          required: true
