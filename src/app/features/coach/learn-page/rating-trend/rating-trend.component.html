<figure class="rating-trend">
  <figcaption>
    <div>
      <p>Rating across imported games</p>
      <h2>Progress over the board</h2>
    </div>
    @if (series().length) {
      <div class="legend" aria-label="Rating platforms">
        @for (item of series(); track item.platform) {
          <span [attr.data-platform]="item.platform">{{ item.label }}</span>
        }
      </div>
    }
  </figcaption>

  @if (series().length) {
    <div class="chart-frame">
      <svg
        viewBox="0 0 720 270"
        preserveAspectRatio="none"
        role="img"
        [attr.aria-label]="ariaLabel()"
      >
        <g class="grid" aria-hidden="true">
          @for (tick of chart().ticks; track tick.y) {
            <line x1="54" x2="702" [attr.y1]="tick.y" [attr.y2]="tick.y" />
            <text x="44" [attr.y]="tick.y + 4">{{ tick.value }}</text>
          }
          @for (file of [0, 1, 2, 3, 4, 5, 6, 7, 8]; track file) {
            <line [attr.x1]="54 + file * 81" [attr.x2]="54 + file * 81" y1="20" y2="234" />
          }
        </g>
        @for (item of chart().series; track item.platform) {
          <g class="rating-line" [attr.data-platform]="item.platform">
            <path [attr.d]="item.path" />
            @for (point of item.plottedPoints; track point.x + '-' + point.y) {
              <rect [attr.x]="point.x - 3" [attr.y]="point.y - 3" width="6" height="6">
                <title>{{ item.label }} · {{ point.rating }} · {{ point.dateLabel }}</title>
              </rect>
            }
          </g>
        }
        <g class="date-axis" aria-hidden="true">
          <text x="54" y="258">{{ chart().firstDate }}</text>
          <text x="702" y="258" text-anchor="end">{{ chart().lastDate }}</text>
        </g>
      </svg>
    </div>

    <div class="rating-summaries">
      @for (item of series(); track item.platform) {
        <div [attr.data-platform]="item.platform">
          <span>{{ item.label }}</span>
          <strong>{{ item.latestRating }}</strong>
          <small [class.positive]="item.change > 0" [class.negative]="item.change < 0">
            {{ changeLabel(item.change) }} from first game
          </small>
        </div>
      }
    </div>
  } @else {
    <div class="empty-chart">
      <span aria-hidden="true">↗</span>
      <div>
        <strong>Your rating line starts with an import</strong>
        <p>Import games with rating data to see your progress on each platform.</p>
      </div>
    </div>
  }
</figure>
