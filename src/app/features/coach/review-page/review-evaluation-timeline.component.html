<section class="evaluation-timeline">
  <div class="timeline-heading">Game pulse</div>

  <div class="timeline-chart">
    <div class="advantage-label white-advantage" aria-hidden="true">White advantage ↑</div>
    <div class="advantage-label black-advantage" aria-hidden="true">Black advantage ↓</div>
    <div class="equal-label" aria-hidden="true">Equal</div>

    <svg
      viewBox="0 0 100 44"
      preserveAspectRatio="none"
      role="img"
      [attr.aria-label]="accessibleLabel()"
    >
      @if (areaPath()) {
        <path class="white-territory" [attr.d]="areaPath()"></path>
      }
      <line class="zero-line" x1="0" y1="22" x2="100" y2="22"></line>
      @for (point of keyPoints(); track point.ply) {
        <circle
          class="key-point"
          [attr.data-classification]="point.classification"
          [attr.cx]="pointX(point)"
          [attr.cy]="pointY(point)"
          r="1.55"
        ></circle>
      }
      @if (currentPoint(); as point) {
        <line
          class="current-line"
          [attr.x1]="pointX(point)"
          y1="0"
          [attr.x2]="pointX(point)"
          y2="44"
        ></line>
        <circle
          class="current-point"
          [attr.cx]="pointX(point)"
          [attr.cy]="pointY(point)"
          r="2.1"
        ></circle>
      }
    </svg>

    @if (selectable()) {
      <ol class="timeline-targets" aria-label="Evaluation points">
        @for (point of points(); track point.ply) {
          <li [style.left.%]="pointX(point)" [style.top.%]="pointY(point) / 0.44">
            <button
              type="button"
              [class.current]="point.ply === currentPly()"
              [attr.aria-label]="'Go to move ' + point.ply"
              (click)="select(point)"
            ></button>
          </li>
        }
      </ol>
    }
  </div>
</section>
