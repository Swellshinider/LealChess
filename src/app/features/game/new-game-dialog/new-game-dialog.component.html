@if (open()) {
  <div class="dialog-backdrop">
    <section role="dialog" aria-modal="true" aria-labelledby="new-game-title">
      @if (canClose()) {
        <button
          class="close"
          type="button"
          aria-label="Close new game dialog"
          (click)="cancelled.emit()"
        >
          ×
        </button>
      }
      <span class="kicker">New match</span>
      <h2 id="new-game-title">Choose your side</h2>
      <p class="intro">Set the board, then make the first plan.</p>

      <div class="color-options" aria-label="Player color">
        @for (option of colors; track option.value) {
          <button
            type="button"
            [class.selected]="color() === option.value"
            [attr.aria-pressed]="color() === option.value"
            (click)="color.set(option.value)"
          >
            <span aria-hidden="true">{{ option.symbol }}</span>
            {{ option.label }}
          </button>
        }
      </div>

      <label for="new-difficulty">Bot difficulty</label>
      <select id="new-difficulty" [value]="difficulty()" (change)="setDifficulty($event)">
        @for (preset of difficulties; track preset.id) {
          <option [value]="preset.id">{{ preset.label }} — {{ preset.description }}</option>
        }
      </select>

      <button class="start" type="button" (click)="start()">Start game</button>
      <small>Stockfish runs entirely on this device.</small>
    </section>
  </div>
}
